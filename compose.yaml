services:
  web:
    build: .
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_NAME: demo_db
      DB_USER: demo_user
      DB_PASSWORD: demo_pass
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: demo_db
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: demo_pass
      MYSQL_ROOT_PASSWORD: demo_root_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdemo_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: